[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kajovong"
version = "0.1.0"
description = "KájovoNG – desktopová automatizace OpenAI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.8,<7",
  "openai>=1.0.0",
  "requests>=2.31.0",
  "paramiko>=3.4.0",
  "keyring>=24.0.0",
  "beautifulsoup4>=4.12.0",
]


[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-qt>=4.4,<5",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "pyinstaller>=6.10,<7",
]

[project.scripts]
kajovong = "kajovo.app.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["kajovo", "kajovo.*", "kajovong"]
exclude = ["tests*"]
namespaces = false

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
