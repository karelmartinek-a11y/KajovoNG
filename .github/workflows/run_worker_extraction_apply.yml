name: run-worker-extraction-apply

on:
  push:
    branches:
      - codex/production-hardening-20260917
    paths:
      - '.github/workflows/run_worker_extraction_apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install headless Qt system runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install canonical environment
        run: python -m pip install -c requirements/constraints.txt -e '.[dev,build]'
      - name: Apply deterministic extraction
        run: python tools/_apply_run_worker_extraction.py
      - name: Verify architecture and focused behavior
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile kajovo/core/pipeline.py kajovo/core/runs/executor.py kajovo/studio/workers/run_worker.py
          if grep -R -n 'PySide6' kajovo/core/pipeline.py kajovo/core/runs; then
            echo '::error::Qt dependency remains in core run layer.'
            exit 1
          fi
          python -m ruff check --select F,B,E9 kajovo/core/pipeline.py kajovo/core/runs kajovo/studio/workers tests
          python -m pytest -q \
            tests/test_run_worker_adapter.py \
            tests/test_workflows.py \
            tests/test_attachments.py \
            tests/test_generate_batch.py \
            tests/test_delivery_pipeline.py \
            tests/test_response_journal.py \
            tests/test_history_forensic.py \
            tests/test_architecture_contracts.py
      - name: Commit extraction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'karelmartinek-a11y'
          git config user.email 'karel.martinek@post.cz'
          git add kajovo/core/pipeline.py kajovo/core/runs/executor.py kajovo/studio/workers kajovo/studio/workbench.py kajovo/studio/history_launcher.py kajovo/desktop/application.py tests
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: extract Qt RunWorker from core pipeline'
          git push origin HEAD:codex/production-hardening-20260917
