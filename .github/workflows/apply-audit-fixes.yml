name: apply-audit-fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reconstruct and verify migration payload
        shell: bash
        run: |
          cat scripts/apply_audit_fixes.py.gz.b64.part* | base64 -d > scripts/apply_audit_fixes.py.gz
          gzip -t scripts/apply_audit_fixes.py.gz
      - name: Apply deterministic SSOT migration
        shell: bash
        run: |
          python - <<'PY'
          import gzip
          from pathlib import Path

          payload = Path('scripts/apply_audit_fixes.py.gz')
          source = gzip.decompress(payload.read_bytes()).decode('utf-8')

          def patch_once(old, new, label):
              global source
              count = source.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one migration-source anchor, got {count}')
              source = source.replace(old, new, 1)

          patch_once(
              'ROOT = Path(__file__).resolve().parents[1]',
              'ROOT = Path.cwd().resolve()',
              'migration root',
          )
          patch_once(
              'state.get("generated_hashes"), allowed, progress=progress)\\n\', \'    if progress:',
              'state.get("generated_hashes"), allowed)\\n\', \'    if progress:',
              'generate-batch original-call anchor',
          )
          patch_once(
              'detail="Ověřuji výsledky proti uloženému manifestu."))\\n    result = import_results(manifest, raw_files, target, state.get("generated_hashes"), allowed)\\n\', \'validate progress gb\')',
              'detail="Ověřuji výsledky proti uloženému manifestu."))\\n    result = import_results(manifest, raw_files, target, state.get("generated_hashes"), allowed, progress=progress)\\n\', \'validate progress gb\')',
              'generate-batch progress propagation',
          )
          patch_once(
              'lambda job: operation(self.client or OpenAIClient(key), job),',
              'lambda job: operation(self._validated_client(key), job),',
              'validated BatchPanel client',
          )
          exec(compile(source, 'scripts/apply_audit_fixes.py', 'exec'))
          PY
      - name: Verify generated source
        shell: bash
        run: |
          python -m compileall -q kajovo kajovong utf8nobom tests Build
          git diff --check
      - name: Remove one-time migration machinery
        shell: bash
        run: |
          rm scripts/apply_audit_fixes.py.gz
          rm scripts/apply_audit_fixes.py.gz.b64.part*
          rm .github/workflows/apply-audit-fixes.yml
      - name: Commit directly to main
        shell: bash
        run: |
          git config user.name 'Kájovo NG SSOT fixer'
          git config user.email 'kajovo-ng-ssot-fixer@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'Migration produced no changes'; exit 1; }
          git commit -m 'Odstranit procesní odchylky podle SSOT'
          git push origin HEAD:main
