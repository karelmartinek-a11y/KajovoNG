name: cascade-executor-extraction-apply

on:
  push:
    branches:
      - codex/production-hardening-20260917
    paths:
      - '.github/workflows/cascade_executor_extraction_apply.yml'

permissions:
  contents: write

jobs:
  extract-and-verify:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install headless Qt system runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install canonical environment
        run: python -m pip install -c requirements/constraints.txt -e '.[dev,build]'
      - name: Apply deterministic cascade extraction with explicit lint closure
        run: python tools/_extract_cascade_executor.py
      - name: Apply safe Ruff fixes to touched cascade surfaces
        run: |
          python -m ruff check --fix --exit-zero --select F,B,E9,I,UP,C4,PIE,SIM,RUF \
            kajovo/core/cascade_pipeline.py \
            kajovo/studio/workers/cascade_worker.py \
            kajovo/studio/cascades.py \
            kajovo/studio/history_launcher.py \
            tests/test_cascade.py \
            tests/test_cascade_v2.py \
            tests/test_cascade_worker_adapter.py \
            tests/test_architecture_contracts.py
      - name: Verify cascade core is Qt-free
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('kajovo/core/cascade_pipeline.py').read_text(encoding='utf-8')
          forbidden = ('PySide6', 'QThread', 'Signal(', 'QObject', 'class CascadeRunWorker')
          found = [item for item in forbidden if item in source]
          if found:
              raise SystemExit('Qt ownership remains in cascade core: ' + ', '.join(found))
          if 'class CascadeRunExecutor' not in source:
              raise SystemExit('CascadeRunExecutor missing after extraction')
          PY
      - name: Verify strict cascade Ruff
        run: |
          python -m ruff check --select F,B,E9,I,UP,C4,PIE,SIM,RUF \
            kajovo/core/cascade_pipeline.py \
            kajovo/studio/workers/cascade_worker.py \
            tests/test_cascade_worker_adapter.py \
            tests/test_architecture_contracts.py
      - name: Verify cascade mypy boundary
        run: python -m mypy --follow-imports=skip kajovo/core/cascade_pipeline.py kajovo/studio/workers/cascade_worker.py
      - name: Verify cascade and history behavior
        run: |
          python -m pytest -q \
            tests/test_cascade.py \
            tests/test_cascade_v2.py \
            tests/test_cascade_worker_adapter.py \
            tests/test_workflows.py::test_custom_cascade_records_each_step \
            tests/test_history_forensic.py \
            tests/test_architecture_contracts.py
      - name: Commit verified cascade extraction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'karelmartinek-a11y'
          git config user.email 'karel.martinek@post.cz'
          git add \
            kajovo/core/cascade_pipeline.py \
            kajovo/studio/workers/cascade_worker.py \
            kajovo/studio/cascades.py \
            kajovo/studio/history_launcher.py \
            kajovo/desktop/application.py \
            tests/test_cascade.py \
            tests/test_cascade_v2.py \
            tests/test_cascade_worker_adapter.py \
            tests/test_workflows.py \
            tests/test_architecture_contracts.py
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: isolate cascade executor from Qt worker'
          git push origin HEAD:codex/production-hardening-20260917
