name: dependency-probe

on:
  push:
    branches:
      - codex/production-hardening-20260917

permissions:
  contents: read

jobs:
  py312-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Resolve dependencies
        run: python -m pip install -e '.[dev,build]'
      - name: Freeze
        run: python -m pip freeze --all

  py313-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Resolve dependencies
        run: python -m pip install -e .[dev,build]
      - name: Freeze
        run: python -m pip freeze --all

  py313-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Resolve dependencies
        run: python -m pip install -e '.[dev,build]'
      - name: Freeze
        run: python -m pip freeze --all
