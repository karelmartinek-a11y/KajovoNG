name: temporary-refactor-codemod

on:
  push:
    branches:
      - refactor/architecture-hardening-20260916
    paths:
      - scripts/_refactor_pipeline.py

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/architecture-hardening-20260916
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply deterministic observability refactor
        run: python scripts/_refactor_pipeline.py
      - name: Commit and remove temporary codemod
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: odstranit tiche chyby v run evidenci"
          git push origin HEAD:refactor/architecture-hardening-20260916
