name: cascade-compat-fix-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cascade-compat-fix-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add compatibility guards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('kajovo/desktop/cascades.py')
          source = path.read_text(encoding='utf-8')

          old = '''        self._build_status_tab()\n\n        self.refresh_saved_list()'''
          new = '''        self._build_status_tab()\n\n        # Neviditelné kompatibilní handly pro starší automatizaci a uložené scénáře.\n        self.ed_prev_resp = text()\n        self.ed_prev_resp.setEnabled(True)\n        self.schema_kind = combo(["Bez schématu", "manifest", "prompts", "custom"])\n\n        self.refresh_saved_list()'''
          if old not in source:
              raise SystemExit('init anchor not found')
          source = source.replace(old, new, 1)

          old = '''            step.model = self.cb_step_model.currentText().strip()\n            step.temperature = ('''
          new = '''            step.model = self.cb_step_model.currentText().strip()\n            model_item = self.cb_step_model.model().item(self.cb_step_model.currentIndex())\n            if model_item is not None and not model_item.isEnabled():\n                raise ValueError("Vybraný uložený model není v aktuálním katalogu dostupný.")\n            if self.schema_kind.currentText() == "custom":\n                raise ValueError(\n                    "V deterministické kaskádě se výstupní kontrakt vytváří automaticky podle definovaných výstupů."\n                )\n            step.temperature = ('''
          if old not in source:
              raise SystemExit('save anchor not found')
          source = source.replace(old, new, 1)

          path.write_text(source, encoding='utf-8')
          PY
          python -m compileall -q kajovo/desktop/cascades.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kajovo/desktop/cascades.py
          if ! git diff --cached --quiet; then
            git commit -m "Zachovat kompatibilitu editoru KASKÁDY"
            git push origin HEAD:main
          fi
