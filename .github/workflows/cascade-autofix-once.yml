name: cascade-autofix-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cascade-autofix-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove unused import
        shell: bash
        run: |
          sed -i '/^[[:space:]]*describe_output,$/d' kajovo/desktop/cascades.py
          python -m compileall -q kajovo/desktop/cascades.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kajovo/desktop/cascades.py
          if ! git diff --cached --quiet; then
            git commit -m "Opravit statickou kontrolu UI KASKÁDY"
            git push origin HEAD:main
          fi
