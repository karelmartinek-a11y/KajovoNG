name: canonical-contract-links

on:
  push:
    branches: [main, fix/canonical-contract-links]
  pull_request:

permissions:
  contents: read

concurrency:
  group: contract-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Immutable source evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Capture tracked source revision without credentials
        run: |
          git archive --format=zip --output=contract-source.zip HEAD
          git rev-parse HEAD > contract-source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-source-${{ github.sha }}
          path: |
            contract-source.zip
            contract-source-sha.txt
          retention-days: 3
  contracts:
    name: canonical-contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Linux Qt runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install contract test environment
        run: python -m pip install -c requirements/constraints.txt -e '.[dev,build]'
      - name: First complete source and physical schema pass
        run: python tools/verify_contract_links.py --output contract-links-first.json
      - name: Canonical identity and schema binding regression
        run: python -m pytest -q tests/test_canonical_contract_links.py
      - name: Recovery and physical contract regression
        run: python -m pytest -q tests/test_orchestration_repository.py tests/test_response_journal.py tests/test_delivery_pipeline.py tests/test_filesystem_boundaries.py tests/test_comic_domain.py tests/test_generate_batch_waves.py tests/test_cascade.py tests/test_cascade_v2.py
      - name: Independent repeated source and physical schema pass
        if: always()
        run: python tools/verify_contract_links.py --output contract-links-second.json --compare contract-links-first.json
      - name: Preserve contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-links-${{ matrix.os }}-${{ github.sha }}
          path: contract-links-*.json
          if-no-files-found: error

  semantic-flows:
    name: semantic-flow-forensic-audit-windows
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install semantic audit environment
        run: python -m pip install -c requirements/constraints.txt -e '.[dev,build]'
      - name: Complete semantic contract and process pass
        run: python tools/verify_semantic_flows.py --output semantic-flow-audit.json
      - name: Preserve semantic audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-flow-audit-windows-${{ github.sha }}
          path: semantic-flow-audit.json
          if-no-files-found: error

  progress-coverage-windows:
    name: circular-progress-complete-windows
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Windows progress audit environment
        run: python -m pip install -c requirements/constraints.txt -e '.[dev,build]'
      - name: Verify all 182 process variants and 1284 reference steps
        run: python tools/verify_progress_coverage.py --output progress-coverage.json
      - name: Circular progress semantic regressions
        run: >-
          python -m pytest -q
          tests/test_progress_full_coverage.py
          tests/test_circular_progress_semantics.py
          tests/test_progress_completion.py
          tests/test_progress_stage_identity.py
          tests/test_progress_terminal_map.py
          tests/test_qa_evidence_links.py
          tests/test_remediation_resources.py
          tests/test_cascade.py
          tests/test_cascade_v2.py
          tests/test_photo_studio.py
          tests/test_comic_domain.py
      - name: Preserve Windows progress evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: progress-coverage-windows-${{ github.sha }}
          path: progress-coverage.json
          if-no-files-found: error
