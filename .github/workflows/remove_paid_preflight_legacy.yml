name: remove-paid-preflight-legacy

on:
  push:
    paths:
      - 'scripts/_remove_paid_preflight_legacy.py'
      - '.github/workflows/remove_paid_preflight_legacy.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: windows-2025
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply deterministic cleanup
        shell: pwsh
        run: python scripts/_remove_paid_preflight_legacy.py
      - name: Syntax and diff guards
        shell: pwsh
        run: |
          python -m compileall -q kajovo tests
          git diff --check
      - name: Remove one-shot migration files
        shell: pwsh
        run: |
          Remove-Item scripts/_remove_paid_preflight_legacy.py
          Remove-Item .github/workflows/remove_paid_preflight_legacy.yml
      - name: Commit cleanup directly to main
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Odstranit legacy preflight API a stavové kostry"
          git push origin HEAD:main
