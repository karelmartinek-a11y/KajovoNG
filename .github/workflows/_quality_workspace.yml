name: quality-workspace
on:
  push:
    paths:
      - '.github/workflows/_quality_workspace.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Export tracked source
        run: git archive --format=zip --output=source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: quality-source
          path: source.zip
          retention-days: 1
      - name: Download declared test dependencies
        run: |
          python -m pip download --only-binary=:all: --dest wheels 'PySide6>=6.8,<7' 'openai>=3.9,<4' 'requests>=2.31' 'paramiko>=3.4' 'keyring>=24' 'jsonschema>=4.23,<5' 'pytest>=9.0.3,<10' 'pytest-qt>=4.4,<5' 'ruff>=0.6,<1' 'pillow>=11,<13' setuptools wheel packaging
      - uses: actions/upload-artifact@v4
        with:
          name: quality-wheels
          path: wheels/*.whl
          compression-level: 0
          retention-days: 1
