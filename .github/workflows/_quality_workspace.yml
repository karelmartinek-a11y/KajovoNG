name: quality-workspace
on:
  push:
    paths:
      - '.github/workflows/_quality_workspace.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export tracked source for verification
        run: git archive --format=zip --output=source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: quality-source
          path: source.zip
          retention-days: 1
