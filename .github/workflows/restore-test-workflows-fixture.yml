name: temporary-restore-test-workflows-fixture

on:
  push:
    branches:
      - refactor/architecture-hardening-20260916
    paths:
      - scripts/.trigger_restore_test_workflows

permissions:
  contents: write

jobs:
  restore-and-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/architecture-hardening-20260916
          fetch-depth: 0
      - name: Restore full file and patch only fixture
        shell: bash
        run: |
          set -euo pipefail
          git show bde33bb8b0a1c2e27abdff5a0822f21ec55471f0:tests/test_workflows.py > tests/test_workflows.py
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_workflows.py')
          text = path.read_text(encoding='utf-8')
          old_import = 'from dataclasses import fields\n'
          new_import = 'from dataclasses import MISSING, fields\nfrom typing import get_origin, get_type_hints\n'
          if text.count(old_import) != 1:
              raise SystemExit(f'Unexpected dataclasses import count: {text.count(old_import)}')
          text = text.replace(old_import, new_import, 1)

          old = '''def make_worker(tmp_path, mode):
              values = {}
              for field in fields(UiRunConfig):
                  annotation = str(field.type)
                  values[field.name] = (False if annotation == "bool" else [] if annotation.startswith("List")
                                        else {} if annotation.startswith("Dict") else 0.0 if annotation == "float" else "")
              values.update(project="test", prompt="Write a file", mode=mode, model="gpt-4o-mini",
                            model_a1="gpt-4o-mini", model_a2="gpt-4o-mini", model_a3="gpt-4o-mini",
                            out_dir=str(tmp_path / "out"), resume_files=None, resume_prev_id=None,
                            preparation_snapshot=None,
                            available_models=["gpt-4o-mini"])
              cfg = UiRunConfig(**values)
'''.replace('            ', '')
          new = '''def make_worker(tmp_path, mode):
              values = {}
              resolved_types = get_type_hints(UiRunConfig)
              for field in fields(UiRunConfig):
                  annotation = resolved_types[field.name]
                  origin = get_origin(annotation)
                  if annotation is bool:
                      value = False
                  elif origin is list:
                      value = []
                  elif origin is dict:
                      value = {}
                  elif annotation is float:
                      value = 0.0
                  elif field.default is not MISSING:
                      value = field.default
                  else:
                      value = ""
                  values[field.name] = value
              values.update(project="test", prompt="Write a file", mode=mode, model="gpt-4o-mini",
                            model_a1="gpt-4o-mini", model_a2="gpt-4o-mini", model_a3="gpt-4o-mini",
                            out_dir=str(tmp_path / "out"), resume_files=None, resume_prev_id=None,
                            preparation_snapshot=None,
                            available_models=["gpt-4o-mini"])
              cfg = UiRunConfig(**values)
'''.replace('            ', '')
          if text.count(old) != 1:
              raise SystemExit(f'Expected one make_worker block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          rm scripts/.trigger_restore_test_workflows
          rm .github/workflows/restore-test-workflows-fixture.yml
          git diff --check
      - name: Commit safe fixture patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: odvodit UiRunConfig fixture ze skutecnych typu"
          git push origin HEAD:refactor/architecture-hardening-20260916
