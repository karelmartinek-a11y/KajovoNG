name: temporary-refactor-ruff-import-fix

on:
  push:
    branches:
      - refactor/architecture-hardening-20260916
    paths:
      - scripts/.trigger_ruff_import_fix

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/architecture-hardening-20260916
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact Ruff import ordering
        run: |
          python -m pip install "ruff==0.16.8"
          python -m ruff check --select I --fix kajovo/core/runs/observability.py kajovo/core/runs/polling.py tests/test_architecture_contracts.py
          python -m ruff check --select I kajovo/core/runs/observability.py kajovo/core/runs/polling.py tests/test_architecture_contracts.py
          rm scripts/.trigger_ruff_import_fix
      - name: Commit import-only fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kajovo/core/runs/observability.py kajovo/core/runs/polling.py tests/test_architecture_contracts.py scripts/.trigger_ruff_import_fix
          git diff --cached --check
          git commit -m "style: srovnat importy podle Ruff 0.16.8"
          git push origin HEAD:refactor/architecture-hardening-20260916
