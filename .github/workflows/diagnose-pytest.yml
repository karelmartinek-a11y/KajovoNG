name: temporary-diagnose-pytest

on:
  push:
    branches:
      - refactor/architecture-hardening-20260916
    paths:
      - scripts/.trigger_pytest_diagnostic

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/architecture-hardening-20260916
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Capture first pytest failure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          python -m pytest -x -vv --tb=long 2>&1 | Tee-Object -FilePath docs/refactor/PYTEST_FAILURE_DIAGNOSTIC.txt
          $code = $LASTEXITCODE
          Add-Content docs/refactor/PYTEST_FAILURE_DIAGNOSTIC.txt "`nPYTEST_EXIT_CODE=$code"
          exit 0
      - name: Commit diagnostic and remove temporary runner
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/.trigger_pytest_diagnostic
          rm .github/workflows/diagnose-pytest.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: zachytit prvni pytest regresi"
          git push origin HEAD:refactor/architecture-hardening-20260916
