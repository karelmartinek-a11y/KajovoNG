name: fix-audit-ci-regressions

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply guarded compatibility and recovery fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected=1, label="replacement"):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise RuntimeError(f"{label}: expected {expected}, got {count}")
              p.write_text(text.replace(old, new, expected), encoding="utf-8")

          # Batch transport: preserve public create_batch compatibility while the
          # work submit explicitly reuses rows already preflighted during upload.
          replace(
              "kajovo/core/openai_client.py",
              '    def create_batch(self, input_file_id: str, endpoint: str = "/v1/responses", completion_window: str = "24h") -> Dict[str, Any]:\n        self._validate_resource_id(input_file_id)\n        if endpoint != "/v1/responses" or completion_window != "24h":\n            raise ValueError("Program podporuje pouze Batch Responses s oknem 24h.")\n        rows = self.validate_batch_data(self.file_content(input_file_id))',
              '    def create_batch(self, input_file_id: str, endpoint: str = "/v1/responses", completion_window: str = "24h", *, _prevalidated_rows=None) -> Dict[str, Any]:\n        """Vytvoří BATCH. `_prevalidated_rows` je interní cesta pouze pro již ověřený work submit.\n\n        Běžné volání vždy znovu načte a kanonicky ověří vzdálený JSONL. Interní\n        work-submit cesta naopak nesmí před jediným POST /batches provést žádnou\n        další síťovou operaci, protože submission_unknown už v tom okamžiku chrání\n        právě transportní neurčitost tohoto POSTu.\n        """\n        self._validate_resource_id(input_file_id)\n        if endpoint != "/v1/responses" or completion_window != "24h":\n            raise ValueError("Program podporuje pouze Batch Responses s oknem 24h.")\n        if _prevalidated_rows is None:\n            rows = self.validate_batch_data(self.file_content(input_file_id))\n        else:\n            rows = list(_prevalidated_rows)\n            if not rows or not all(isinstance(row, dict) and isinstance(row.get("body"), dict) for row in rows):\n                raise ValueError("Interní work submit vyžaduje již ověřené řádky dávky.")',
              label="OpenAIClient create_batch prevalidated contract",
          )
          replace(
              "kajovo/core/batch_submit.py",
              '    body = {"input_file_id": input_file_id, "endpoint": endpoint, "completion_window": completion_window}\n    result = client._req("POST", "/batches", json_body=body)\n    policy = getattr(client, "_policy", None)\n    if policy is not None:\n        for row in rows:\n            payload = row.get("body") if isinstance(row, dict) else None\n            if isinstance(payload, dict):\n                policy.proofs.pop(policy.key(payload, True), None)\n        policy.save()\n    return result',
              '    verified_rows = list(rows)\n    if not verified_rows:\n        raise ValueError("Pracovní dávka neobsahuje žádný ověřený požadavek.")\n    # OpenAIClient zde dostane přesně řádky, které upload_file(purpose=batch)\n    # již kanonicky ověřil. create_batch proto přeskočí druhý preflight, ale\n    # zachová jedinou veřejnou transportní cestu a úklid proof cache po úspěchu.\n    return client.create_batch(\n        input_file_id=input_file_id, endpoint=endpoint, completion_window=completion_window,\n        _prevalidated_rows=verified_rows,\n    )',
              label="batch_submit public transport",
          )

          # BatchPanel: preserve the old internal one-argument operation hook for
          # callers/tests while current operations may consume Job progress.
          replace(
              "kajovo/desktop/batches.py",
              'import json\nimport time',
              'import inspect\nimport json\nimport time',
              label="BatchPanel inspect import",
          )
          replace(
              "kajovo/desktop/batches.py",
              '    def _start_operation(self, title, operation, *, run_id=None):\n        if self._operation_task:',
              '    @staticmethod\n    def _invoke_operation(operation, client, job):\n        """Volá starší operation(client) i novější operation(client, job) bez maskování TypeError uvnitř operace."""\n        try:\n            signature = inspect.signature(operation)\n        except (TypeError, ValueError):\n            return operation(client, job)\n        params = list(signature.parameters.values())\n        positional = [p for p in params if p.kind in (p.POSITIONAL_ONLY, p.POSITIONAL_OR_KEYWORD)]\n        if any(p.kind == p.VAR_POSITIONAL for p in params) or len(positional) >= 2:\n            return operation(client, job)\n        return operation(client)\n\n    def _start_operation(self, title_or_operation, operation=None, *, run_id=None):\n        if operation is None:\n            operation = title_or_operation\n            title = "Zpracování výsledků BATCH"\n        else:\n            title = str(title_or_operation)\n        if self._operation_task:',
              label="BatchPanel compatible operation contract",
          )
          replace(
              "kajovo/desktop/batches.py",
              '            lambda job: operation(self._validated_client(key), job),',
              '            lambda job: self._invoke_operation(operation, self._validated_client(key), job),',
              label="BatchPanel operation invocation",
          )

          # Recovery structure and skip-completed are intentionally different:
          # historical safe paths can rebuild a missing file, while skipping it
          # still requires verified_output_evidence elsewhere.
          replace(
              "kajovo/desktop/recovery.py",
              'from ..core.runlog import verified_output_evidence',
              'from ..core.runlog import load_output_evidence',
              label="recovery evidence import",
          )
          replace(
              "kajovo/desktop/recovery.py",
              '            for entry in verified_output_evidence(source, source_out):\n                structure.append({"path": entry["path"], "purpose": entry.get("purpose", "")})',
              '            for entry in load_output_evidence(source):\n                try:\n                    if source_out:\n                        safe_join_under_root(source_out, entry["path"])\n                except ValueError:\n                    continue\n                structure.append({"path": entry["path"], "purpose": entry.get("purpose", "")})',
              label="recovery historical structure",
          )

          # The obsolete test modeled a second PreflightPending from create_batch.
          # That state is impossible in the new SSOT boundary: upload performs the
          # preflight, then work create_batch receives _prevalidated_rows.
          replace(
              "tests/test_generate_batch.py",
              'def test_second_validation_pending_is_safe_to_resume(tmp_path):\n    from kajovo.core.response_policy import PreflightPending\n    from kajovo.core.runlog import RunLogger\n    worker = make_worker(tmp_path, "GENERATE")\n    client = Mock()\n    client.upload_file.return_value = {"id": "file_work"}\n    client.create_batch.side_effect = PreflightPending("Čeká", "batch_trial", "in_progress")\n    with pytest.raises(PreflightPending):\n        worker._submit_generate_batch(client, manifest())\n    RunLogger(worker.settings.log_dir, worker.log.run_id, resume=True)',
              'def test_work_submission_reuses_preflighted_rows_without_second_validation(tmp_path):\n    worker = make_worker(tmp_path, "GENERATE")\n    client = Mock()\n    client.upload_file.return_value = {"id": "file_work"}\n    client.create_batch.return_value = {"id": "batch_work", "status": "validating"}\n    result = worker._submit_generate_batch(client, manifest())\n    assert result["batch_id"] == "batch_work"\n    client.create_batch.assert_called_once()\n    kwargs = client.create_batch.call_args.kwargs\n    assert kwargs["input_file_id"] == "file_work"\n    assert kwargs["endpoint"] == "/v1/responses"\n    assert kwargs["_prevalidated_rows"] == manifest()["requests"]\n    state = json.loads(Path(worker.log.state_path).read_text(encoding="utf-8"))\n    assert state["submission_unknown"] is False',
              label="second preflight regression test",
          )
          PY
      - name: Verify source integrity
        shell: bash
        run: |
          python -m compileall -q kajovo kajovong utf8nobom tests Build
          git diff --check
          grep -q '_prevalidated_rows=verified_rows' kajovo/core/batch_submit.py
          grep -q 'load_output_evidence(source)' kajovo/desktop/recovery.py
      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm .github/workflows/fix-audit-ci-regressions.yml
          git config user.name 'Kájovo NG SSOT fixer'
          git config user.email 'kajovo-ng-ssot-fixer@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'No changes'; exit 1; }
          git commit -m 'Zpevnit BATCH transport a obnovu ReRun'
          git push origin HEAD:main
