name: temporary-sync-ui-legacy-boundary

on:
  push:
    branches:
      - refactor/architecture-hardening-20260916
    paths:
      - scripts/_sync_ui_legacy_boundary.py

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/architecture-hardening-20260916
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Synchronize UI documentation
        run: python scripts/_sync_ui_legacy_boundary.py
      - name: Commit synchronized documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: popsat produkcni hranici legacy desktopu"
          git push origin HEAD:refactor/architecture-hardening-20260916
