name: temp-apply-payload
on:
  push:
    branches: [change-run-config-v2-implementation]
    paths:
      - '.tmp_payload/part-20'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: change-run-config-v2-implementation
          fetch-depth: 0
          persist-credentials: true
      - name: Apply implementation payload
        shell: bash
        run: |
          set -euo pipefail
          test -d .tmp_payload
          cat .tmp_payload/part-* | base64 -d > /tmp/kajovo_changes.tar.xz
          echo "48a6827b3012f26f2e05f43fc3e4212747fb87072b53c660e2cc15e1aa3c47a9  /tmp/kajovo_changes.tar.xz" | sha256sum -c -
          tar -xJf /tmp/kajovo_changes.tar.xz -C .
          rm -rf .tmp_payload
          rm -f .github/workflows/temp-apply-payload.yml .github/workflows/temp-export-source.yml
          git config user.name "KajovoNG automation"
          git config user.email "noreply@github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: implement CHANGE orchestration and RUN_CONFIG_V2 controls"
          git push origin HEAD:change-run-config-v2-implementation
