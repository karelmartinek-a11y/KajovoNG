# One-shot finalization workflow. This comment intentionally retriggers the interrupted hardening run.
name: finalize-nine-hardening

on:
  push:
    branches:
      - codex/final-nine-hardening-20260917
    paths:
      - 'tools/_finalize_nine_hardening.py'
      - 'tools/_finalize_nine_postfix.py'
      - 'tools/_finalize_lfs_checkout.py'
      - '.github/workflows/finalize_nine_hardening.yml'

permissions:
  contents: write

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  transform-verify-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          lfs: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install headless Qt runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install canonical environment
        run: python -m pip install -c requirements/constraints.txt -e '.[dev,build]'
      - name: Apply verified Studio consolidation and final decomposition
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/_r05c_finalize_studio.py')
          text = path.read_text(encoding='utf-8')
          strict = '''    missing = names - {
              node.name
              for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name in names
          }
          if missing:
              raise RuntimeError(f"Missing functions in {relative}: {sorted(missing)}")
          '''
          if strict in text:
              text = text.replace(strict, '')
              path.write_text(text, encoding='utf-8')
          PY
          python tools/_r05c_finalize_studio.py
          python tools/_r05c_postfix.py
          python tools/_finalize_nine_hardening.py
          python tools/_finalize_nine_postfix.py
          python tools/_finalize_lfs_checkout.py
      - name: Normalize extracted modules and migrated tests
        shell: bash
        run: |
          python -m ruff check --fix --exit-zero --select F,B,E9,I,UP,C4,PIE,SIM,RUF \
            kajovo/core/runs kajovo/core/pipeline.py kajovo/core/diagnostics/windows.py \
            tests/test_hardening_contracts.py tests/test_ui_progress.py tests/test_progress_completion.py \
            tests/test_batch_completion_ui.py tests/test_studio_contracts.py \
            tests/test_response_journal.py tests/test_process_audit_regressions.py \
            tests/test_run_bundle.py tests/test_photo_studio.py \
            tests/test_architecture_contracts.py tests/test_studio.py
          python -m ruff check --select F,B,E9,I,UP,C4,PIE,SIM,RUF \
            kajovo/core/runs kajovo/core/pipeline.py kajovo/core/diagnostics/windows.py \
            tests/test_hardening_contracts.py tests/test_ui_progress.py tests/test_progress_completion.py \
            tests/test_batch_completion_ui.py tests/test_studio_contracts.py \
            tests/test_response_journal.py tests/test_process_audit_regressions.py \
            tests/test_run_bundle.py tests/test_photo_studio.py \
            tests/test_architecture_contracts.py tests/test_studio.py
          python -m ruff check --select F,B,E9 kajovo kajovong utf8nobom tests Build tools
          python -m compileall -q kajovo tests scripts tools
          git diff --check
      - name: Type and architecture gates
        shell: bash
        run: |
          python -m mypy --follow-imports=skip kajovo/core/runs kajovo/core/openai_transport.py kajovo/core/cascade_pipeline.py kajovo/core/diagnostics/windows.py
          python -m pytest -q \
            tests/test_hardening_contracts.py \
            tests/test_architecture_contracts.py \
            tests/test_run_contracts.py \
            tests/test_run_lifecycle.py \
            tests/test_run_cancellation.py \
            tests/test_run_worker_adapter.py \
            tests/test_cascade_worker_adapter.py \
            tests/test_repository_contract.py
          python scripts/audit_ui.py --check
      - name: Focused behavioral regression
        run: >-
          python -m pytest -q
          tests/test_workflows.py
          tests/test_delivery_pipeline.py
          tests/test_structure_preparation.py
          tests/test_response_journal.py
          tests/test_output_chunks.py
          tests/test_desktop_preparation_recovery.py
          tests/test_ui_progress.py
          tests/test_progress_completion.py
          tests/test_batch_completion_ui.py
          tests/test_studio.py
          tests/test_studio_contracts.py
          tests/test_photo_studio.py
          tests/test_process_audit_regressions.py
      - name: Full regression and coverage
        run: python -m pytest -q --cov=kajovo --cov-report=term-missing --cov-fail-under=70
      - name: Dependency consistency
        run: |
          python tools/verify_dependency_contract.py
          python -m pip check
      - name: Remove migration-only artifacts and verify hygiene
        shell: bash
        run: |
          rm -f \
            tools/_r05a_detach_legacy_core_contracts.py \
            tools/_r05b_migrate_studio_audit.py \
            tools/_r05c_finalize_studio.py \
            tools/_r05c_postfix.py \
            tools/_fix_cascade_type_shadow.py \
            tools/_finalize_nine_hardening.py \
            tools/_finalize_nine_postfix.py \
            tools/_finalize_lfs_checkout.py \
            .github/workflows/r05a_detach_legacy_core_contracts.yml \
            .github/workflows/r05b_studio_audit_migration.yml \
            .github/workflows/r05c_finalize_studio.yml \
            .github/workflows/finalize_nine_hardening.yml
          test ! -d kajovo/desktop
          test ! -e aa.txt
          test ! -d LOG
          test "$(wc -l < kajovo/core/runs/executor.py)" -lt 650
          ! grep -R -nE '^\s*(from|import)\s+kajovo\.desktop' kajovo tests scripts tools --include='*.py'
          git add -A
          ! git ls-files | grep -E '(^LOG/|^aa\.txt$|__pycache__|\.py[co]$|\.pytest_cache|\.mypy_cache|\.ruff_cache)'
          ! git ls-files 'tools/_*.py' | grep .
          git diff --cached --check
      - name: Commit verified final hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'karelmartinek-a11y'
          git config user.email 'karel.martinek@post.cz'
          git commit -m 'refactor: complete nine-point production hardening'
          git push origin HEAD:codex/final-nine-hardening-20260917
