name: semantic-audit-branch

on:
  push:
    branches:
      - audit/semantic-closure-20260928-r2

permissions:
  contents: write

concurrency:
  group: semantic-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forensic-validation:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      KAJOVO_LIVE_ACCEPTANCE: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Create project environment
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install -c requirements/constraints.txt -e .[dev,build]
      - name: Regenerate canonical UI matrix
        shell: pwsh
        run: |
          .venv\Scripts\python.exe scripts/export_ui_validation.py
          .venv\Scripts\python.exe -c "from pathlib import Path; from scripts.export_ui_validation import render, ROOT; Path('UI_VALIDATION_MATRIX.generated.csv').write_text(render(ROOT), encoding='utf-8', newline='')"
          git diff --quiet -- docs/UI_VALIDATION_MATRIX.csv
          if ($LASTEXITCODE -ne 0) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/UI_VALIDATION_MATRIX.csv
            git commit -m "docs: regenerate canonical UI validation matrix"
            git push origin HEAD:audit/semantic-closure-20260928-r2
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ui-validation-generated
          path: UI_VALIDATION_MATRIX.generated.csv
          if-no-files-found: error
      - name: Targeted forensic regressions
        shell: pwsh
        run: |
          .venv\Scripts\python.exe -m pytest -q tests/test_audit_supporting_contracts.py tests/test_preparation_boundaries.py
      - name: Semantic runtime audit
        shell: pwsh
        run: .venv\Scripts\python.exe tools/verify_semantic_flows.py --output semantic-flow-audit.json
      - name: Full pytest
        shell: pwsh
        run: .venv\Scripts\python.exe -m pytest -q
      - name: Ruff
        shell: pwsh
        run: .venv\Scripts\python.exe -m ruff check --select F,B,E9 kajovo kajovong utf8nobom tests Build
      - name: Pip check
        shell: pwsh
        run: .venv\Scripts\python.exe -m pip check
