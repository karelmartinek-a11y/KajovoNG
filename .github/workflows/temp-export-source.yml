name: temp-export-source

on:
  push:
    branches:
      - change-run-config-v2-implementation
    paths:
      - '.github/workflows/temp-export-source.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false
      - name: Pack source
        shell: bash
        run: |
          set -euo pipefail
          git lfs pull
          git archive --format=zip --output=kajovong-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: kajovong-source
          path: kajovong-source.zip
          if-no-files-found: error
          retention-days: 1
