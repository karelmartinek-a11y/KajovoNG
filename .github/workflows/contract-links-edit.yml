name: contract-links-guarded-edit
on:
  push:
    branches: [fix/canonical-contract-links]
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'karelmartinek-a11y/KajovoNG' && contains(github.event.head_commit.message, '[contract-patch]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply exact source edits in isolated checkout
        run: python tools/_contract_patch.py
      - name: Validate Python syntax of all changed files
        run: |
          python - <<'PY'
          import ast, pathlib, subprocess
          names = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          names += subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines()
          for name in names:
              if name.endswith('.py'):
                  ast.parse(pathlib.Path(name).read_bytes(), filename=name)
          print('Parsed changed files:', len(names))
          PY
      - name: Commit only to the same unchanged work branch
        env:
          GH_WRITE_TOKEN: ${{ github.token }}
          EXPECTED_PARENT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import base64, os, subprocess
          branch = 'fix/canonical-contract-links'
          def git(*args, **kw):
              return subprocess.check_output(['git', *args], text=True, **kw).strip()
          if git('rev-parse', 'HEAD') != os.environ['EXPECTED_PARENT']:
              raise SystemExit('Unexpected checkout parent')
          git('fetch', '--prune', 'origin', branch)
          if git('rev-parse', 'origin/' + branch) != os.environ['EXPECTED_PARENT']:
              raise SystemExit('Concurrent branch change; refusing overwrite')
          changed = git('diff', '--name-only').splitlines()
          changed += git('ls-files', '--others', '--exclude-standard').splitlines()
          allowed = {'kajovo/core/orchestration/work_order.py', 'kajovo/core/orchestration/provider_operations.py', 'kajovo/core/orchestration/request_binding.py', 'kajovo/core/orchestration/publish.py', 'kajovo/core/comic_service.py', 'kajovo/core/runlog.py', 'kajovo/core/safe_config.py', 'tests/test_orchestration_repository.py', 'tests/test_delivery_pipeline.py'}
          if not changed or not set(changed) <= allowed:
              raise SystemExit('Unexpected change scope')
          git('add', '--', *sorted(set(changed)))
          git('-c', 'user.name=github-actions[bot]', '-c', 'user.email=41898282+github-actions[bot]@users.noreply.github.com', 'commit', '-m', 'Svazat WorkOrder s payloadem a opravit obnovu publikace a komiksu')
          env = dict(os.environ)
          token = base64.b64encode(('x-access-token:' + env.pop('GH_WRITE_TOKEN')).encode()).decode()
          env.update(GIT_CONFIG_COUNT='1', GIT_CONFIG_KEY_0='http.https://github.com/.extraheader', GIT_CONFIG_VALUE_0='AUTHORIZATION: basic ' + token, GIT_TERMINAL_PROMPT='0')
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/' + branch], check=True, env=env)
          print('IMPLEMENTED_WORK_SHA', git('rev-parse', 'HEAD'))
          PY
